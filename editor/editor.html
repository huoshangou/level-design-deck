<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>level-design-deck · editor</title>
<script src="views/spatial_layout.js"></script>
<script src="views/level_doc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>mermaid.initialize({startOnLoad:false, theme:'default', securityLevel:'loose', flowchart:{useMaxWidth:true, htmlLabels:true}});</script>
<style>
:root { --fg:#1a1a1a; --muted:#666; --bg:#fafafa; --surface:#fff; --line:#e5e5e5; --accent:#0066cc; --error:#dc2626; --review:#d97706; --missing:#7c3aed; --extra:#2563eb; }
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;height:100vh;color:var(--fg);background:var(--bg);font-size:13px;line-height:1.6}
aside{width:340px;min-width:340px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:16px}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
aside .stats{font-size:11px;color:var(--muted);margin-bottom:12px;font-family:"JetBrains Mono","Consolas",monospace}
aside .alert{padding:8px 10px;margin-bottom:6px;border-left:3px solid var(--line);background:var(--bg);cursor:pointer;border-radius:0 4px 4px 0;font-size:12px}
aside .alert:hover{background:#f0f0f0}
aside .alert .level{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-right:6px;padding:1px 6px;border-radius:3px;color:#fff}
aside .alert.ERROR{border-left-color:var(--error)} aside .alert.ERROR .level{background:var(--error)}
aside .alert.REVIEW{border-left-color:var(--review)} aside .alert.REVIEW .level{background:var(--review)}
aside .alert.MISSING{border-left-color:var(--missing)} aside .alert.MISSING .level{background:var(--missing)}
aside .alert.EXTRA{border-left-color:var(--extra)} aside .alert.EXTRA .level{background:var(--extra)}
aside .alert .path{font-family:"JetBrains Mono","Consolas",monospace;font-size:11px;color:var(--accent);margin-bottom:2px}
aside .alert .msg{color:var(--muted);font-size:11px}
aside .empty{color:var(--muted);font-size:11px;font-style:italic;padding:8px 10px}
main{flex:1;overflow-y:auto;padding:24px 32px;position:relative}
.toolbar{display:flex;gap:8px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:24px;position:sticky;top:0;background:var(--bg);padding-top:0;z-index:10}
.toolbar .title{font-weight:600;font-size:14px;flex:1}
button{padding:6px 14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:4px;cursor:pointer;font-size:12px}
button:hover{background:#f0f0f0}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{background:#0052a3}
button:disabled{opacity:0.5;cursor:not-allowed}
fieldset{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:16px;background:var(--surface)}
legend{font-size:13px;font-weight:600;color:var(--accent);padding:0 8px}
legend .schema-desc{color:var(--muted);font-weight:400;font-size:11px;margin-left:8px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text);margin-bottom:4px;font-weight:500}
.field label .required{color:var(--error);margin-left:4px}
.field label .desc{color:var(--muted);font-weight:400;margin-left:8px;font-size:11px}
.field label .key{color:#aaa;font-family:"JetBrains Mono","Consolas",monospace;font-weight:400;font-size:10px;margin-left:6px}
legend .key{color:#aaa;font-family:"JetBrains Mono","Consolas",monospace;font-weight:400;font-size:10px;margin-left:6px}
.field input[type=text],.field textarea,.field select{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:4px;font-size:13px;font-family:inherit;background:#fff}
.field textarea{resize:vertical;min-height:80px;line-height:1.6}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,102,204,0.1)}
.field.has-error input,.field.has-error textarea{border-color:var(--error)}
.field.has-review input,.field.has-review textarea{border-color:var(--review)}
.field .pattern-hint{font-size:10px;color:var(--muted);font-family:"JetBrains Mono",monospace;margin-top:2px}
.array-item{border:1px dashed var(--line);border-radius:4px;padding:10px;margin-bottom:8px;background:#fafafa}
.array-item .remove{float:right;font-size:11px;color:var(--error);cursor:pointer;background:none;border:none;padding:0}
.array-add{font-size:11px;color:var(--accent);cursor:pointer;background:none;border:1px dashed var(--accent);padding:4px 12px;border-radius:4px}
.tag-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag-list .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:#f5f5f5;border-radius:12px;font-size:11px;font-family:"JetBrains Mono",monospace}
.tag-list .tag .x{cursor:pointer;color:var(--muted)}
.tag-list .tag .x:hover{color:var(--error)}
.tag-list input{border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:11px;width:160px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--fg);color:#fff;padding:10px 16px;border-radius:4px;font-size:12px;opacity:0;transition:opacity 0.2s;pointer-events:none;z-index:200}
.toast.show{opacity:1}

/* === Bubble diagram 专用视图 (M3.3) === */
#mermaid-preview{position:sticky;top:46px;background:#fafafa;border:1px solid var(--line);border-radius:6px;margin-bottom:20px;max-height:50vh;overflow:auto;z-index:5}
#mermaid-preview .mermaid-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace;background:#fff}
#mermaid-preview pre.mermaid{background:#fff;padding:16px;min-height:120px;text-align:center;margin:0;font-family:"JetBrains Mono",monospace;font-size:12px}
#mermaid-preview g.node{transition:filter 0.15s}
#mermaid-preview g.node:hover{filter:brightness(0.9)}
#mermaid-preview g.node.hl rect,#mermaid-preview g.node.hl polygon,#mermaid-preview g.node.hl circle,#mermaid-preview g.node.hl ellipse,#mermaid-preview g.node.hl path{stroke:var(--accent)!important;stroke-width:3px!important}

.section-title{font-size:13px;font-weight:600;color:var(--accent);margin:8px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.section-title .muted{color:var(--muted);font-weight:400;font-family:"JetBrains Mono",monospace;font-size:11px}

.node-card{border:1px solid var(--line);border-left:4px solid var(--type-color,var(--line));border-radius:0 6px 6px 0;padding:12px 14px;margin-bottom:12px;background:var(--surface);transition:box-shadow 0.3s}
.node-card[data-type="entry"]{--type-color:#10b981}
.node-card[data-type="exit"]{--type-color:#6b7280}
.node-card[data-type="combat"]{--type-color:#ef4444}
.node-card[data-type="choice"]{--type-color:#f59e0b}
.node-card[data-type="puzzle"]{--type-color:#f59e0b}
.node-card[data-type="scene"]{--type-color:#3b82f6}
.node-card[data-type="dialogue"]{--type-color:#8b5cf6}
.node-card[data-type="cutscene"]{--type-color:#ec4899}
.node-card.flash{box-shadow:0 0 0 3px var(--type-color)}
.node-card.has-error{border-color:var(--error)}
.node-card .card-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.type-pill{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding:2px 8px;border-radius:3px;background:var(--type-color,#ccc);color:#fff;font-family:"JetBrains Mono",monospace}
.card-id{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--fg);font-weight:600}
.card-actions{margin-left:auto;display:flex;gap:4px}
.card-actions button{padding:3px 8px;font-size:11px;border:1px solid var(--line);background:#fff;cursor:pointer;border-radius:3px}
.card-actions button.danger{color:var(--error);border-color:#fbcaca}
.card-actions button:hover{background:#f0f0f0}

.card-fields{display:grid;grid-template-columns:60px 1fr;gap:6px 10px;align-items:start;margin-bottom:10px}
.card-fields label{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace;padding-top:6px}
.card-fields input,.card-fields textarea,.card-fields select{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:3px;font-size:12px;font-family:inherit;background:#fff}
.card-fields textarea{min-height:42px;resize:vertical;line-height:1.5}
.card-fields input:focus,.card-fields textarea:focus,.card-fields select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,102,204,0.1)}

.edges-section{border-top:1px dashed var(--line);padding-top:8px}
.edges-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px;font-size:11px}
.edges-label{min-width:60px;color:var(--muted);font-family:"JetBrains Mono",monospace}
.edges-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1}
.edge-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;background:#f0f7ff;border:1px solid #d0e3ff;border-radius:12px;font-size:11px;font-family:"JetBrains Mono",monospace;cursor:pointer;color:var(--fg)}
.edge-chip:hover{background:#e0eeff}
.edge-chip.readonly{background:#f5f5f5;border-color:var(--line);color:var(--muted)}
.edge-chip .chip-type{color:var(--muted);font-size:10px}
.edge-chip .chip-req{color:var(--accent);font-weight:500;font-size:10px}
.empty-chip{font-size:11px;color:var(--muted);font-style:italic}
.add-edge-btn{padding:1px 8px;font-size:11px;border:1px dashed var(--accent);color:var(--accent);background:none;cursor:pointer;border-radius:12px}
.add-node-btn{margin-top:12px;padding:8px 16px;border:1px dashed var(--accent);color:var(--accent);background:none;cursor:pointer;border-radius:4px;font-size:12px;width:100%}
.add-node-btn:hover{background:#f0f7ff}

/* Popover */
#popover-host{display:none}
#popover-host.show{display:block}
.popover-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:100}
.popover{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:8px;padding:20px 24px;min-width:380px;max-width:520px;max-height:80vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,0.2);z-index:101}
.popover h3{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--accent)}
.popover label{display:block;font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace;margin:8px 0 2px}
.popover input,.popover select,.popover textarea{width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:4px;font-size:13px;font-family:inherit;background:#fff}
.popover input:focus,.popover select:focus,.popover textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,102,204,0.1)}
.popover .hint{font-size:11px;color:var(--muted);margin:4px 0 8px;padding:6px 10px;background:#fafafa;border-left:3px solid var(--review);border-radius:0 4px 4px 0}
.popover .popover-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.popover .popover-actions button{padding:6px 14px;font-size:12px;border:1px solid var(--line);background:#fff;cursor:pointer;border-radius:4px}
.popover .popover-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.popover .popover-actions button.danger{color:var(--error);border-color:#fbcaca}
.popover .popover-actions button.danger:hover{background:#fef2f2}
</style>
</head>
<body>

<aside>
  <h2>检测告警</h2>
  <div class="stats" id="stats">加载中...</div>
  <div id="alerts"></div>
</aside>

<main>
  <div class="toolbar">
    <div class="title" id="page-title">editor</div>
    <select id="spec-select" onchange="switchSpec(this.value)" title="切换 spec"
            style="font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;font-family:'JetBrains Mono','Consolas',monospace;max-width:280px"></select>
    <button onclick="reloadAll()">↻ 重跑检测</button>
    <button onclick="saveSpec()" class="primary" id="save-btn">保存</button>
    <button onclick="renderHtml()">重渲染 HTML</button>
    <button onclick="openFullDocument()" title="同 level 多 module 拼成一份完整文档">📚 完整关卡文档</button>
  </div>
  <div id="mermaid-preview" hidden>
    <div class="mermaid-header">
      <span>流程图（点节点定位卡片 / 改字段实时刷新）</span>
      <span id="mermaid-stats"></span>
    </div>
    <pre class="mermaid" id="mermaid-canvas">graph TD
  loading["加载中..."]</pre>
  </div>
  <div id="form"></div>
</main>

<div id="popover-host"></div>
<div class="toast" id="toast"></div>

<script>
const URL_SPEC = new URLSearchParams(location.search).get('spec') || 'demo_lighting_req';
const WARNINGS_PATH = '/outputs/.warnings.json';
const DIFF_PATH = '/outputs/.diff.json';
const CROSS_WARNINGS_PATH = '/outputs/.cross_warnings.json';

let PATHS = null, SPEC = null, SCHEMA = null, ALERTS = [], CROSS_ALERTS = [];

function switchSpec(id) { location.assign('?spec=' + encodeURIComponent(id)); }

async function loadSpecList() {
  const r = await fetch('/api/specs');
  if (!r.ok) return;
  const {specs} = await r.json();
  const sel = document.getElementById('spec-select');
  sel.innerHTML = specs.map(s =>
    `<option value="${escapeHtml(s)}" ${s===URL_SPEC?'selected':''}>${escapeHtml(s)}</option>`
  ).join('');
}

async function loadAll() {
  const r = await fetch('/api/paths?spec=' + encodeURIComponent(URL_SPEC));
  if (!r.ok) throw new Error(`无法解析 spec_id "${URL_SPEC}" 的路径，请确认 specs/ 下有对应文件`);
  PATHS = await r.json();
  const [spec, schema, warn, diff, cross, _list] = await Promise.all([
    fetch(PATHS.spec).then(r => r.json()),
    fetch(PATHS.schema).then(r => r.json()),
    fetch(WARNINGS_PATH).then(r => r.ok ? r.json() : {errors:[],reviews:[]}).catch(()=>({errors:[],reviews:[]})),
    fetch(DIFF_PATH).then(r => r.ok ? r.json() : {missing:[],extra:[]}).catch(()=>({missing:[],extra:[]})),
    fetch(CROSS_WARNINGS_PATH).then(r => r.ok ? r.json() : {errors:[],reviews:[]}).catch(()=>({errors:[],reviews:[]})),
    loadSpecList(),
  ]);
  SPEC = spec; SCHEMA = schema;
  ALERTS = [
    ...(warn.errors || []).map(a => ({...a, kind: 'ERROR', path: a.field_path})),
    ...(warn.reviews || []).map(a => ({...a, kind: 'REVIEW', path: a.field_path})),
    ...(diff.missing || []).map(a => ({...a, kind: 'MISSING', path: a.expected_spec_path, msg: a.msg})),
    ...(diff.extra || []).map(a => ({...a, kind: 'EXTRA', path: a.spec_path, msg: a.msg})),
    ...(cross.errors || []).map(a => ({...a, kind: 'ERROR', path: a.field_path, msg: `[cross] ${a.msg}`})),
    ...(cross.reviews || []).map(a => ({...a, kind: 'REVIEW', path: a.field_path, msg: `[cross] ${a.msg}`})),
  ];
  renderForm();
  renderAlerts();
}

function renderAlerts() {
  const stats = document.getElementById('stats');
  const counts = {ERROR:0, REVIEW:0, MISSING:0, EXTRA:0};
  ALERTS.forEach(a => counts[a.kind] = (counts[a.kind]||0)+1);
  stats.textContent = `errors=${counts.ERROR} reviews=${counts.REVIEW} missing=${counts.MISSING} extra=${counts.EXTRA}`;
  const box = document.getElementById('alerts');
  if (!ALERTS.length) { box.innerHTML = '<div class="empty">无告警 ✓</div>'; return; }
  box.innerHTML = ALERTS.map(a => `
    <div class="alert ${a.kind}" onclick="jumpTo('${a.path}')">
      <span class="level">${a.kind}</span>
      <div class="path">${a.path}</div>
      <div class="msg">${escapeHtml(a.msg || '')}</div>
    </div>
  `).join('');
}

function jumpTo(path) {
  // 优先匹配 nodes[i]... 跳到对应节点卡片
  const nodeMatch = path.match(/^nodes\[(\d+)\]/);
  if (nodeMatch && isBubbleSpec(SPEC)) {
    const node = (SPEC.nodes || [])[parseInt(nodeMatch[1])];
    if (node && node.id) { jumpToNodeCard(node.id); return; }
  }
  const el = document.querySelector(`[data-path="${CSS.escape(path)}"]`);
  if (el) {
    el.scrollIntoView({behavior:'smooth', block:'center'});
    const input = el.querySelector('input,textarea,select');
    if (input) input.focus();
  }
}

function renderForm() {
  const root = document.getElementById('form');
  const meta = SPEC.meta || {};
  const subj = meta.poi_id || meta.level_id || '(no id)';
  document.getElementById('page-title').textContent = `${meta.spec_id || URL_SPEC}: ${subj} v${meta.version || '?'}`;

  const preview = document.getElementById('mermaid-preview');
  if (isSpatialLayout(SPEC)) {
    preview.hidden = true;
    root.innerHTML = renderSpatialLayoutView(SPEC, SCHEMA);
    bindInputs(root);
  } else if (isBubbleSpec(SPEC)) {
    preview.hidden = false;
    root.innerHTML = renderBubbleDiagramView(SPEC, SCHEMA);
    bindBubbleDiagramHandlers(root);
    refreshMermaid(true);
  } else {
    preview.hidden = true;
    root.innerHTML = renderObject(SPEC, SCHEMA, '');
    bindInputs(root);
  }
}

function renderObject(value, schema, path) {
  const props = schema.properties || {};
  const required = schema.required || [];
  return Object.keys(props).map(key => {
    const subPath = path ? `${path}.${key}` : key;
    const subSchema = props[key];
    const subValue = value && value[key];
    const isReq = required.includes(key);
    return renderField(subValue, subSchema, subPath, key, isReq);
  }).join('');
}

function labelFor(schema, key) {
  return (schema && schema.title) ? schema.title : key;
}
function fieldLabelHtml(schema, key, isRequired) {
  const title = schema && schema.title;
  const desc = schema && schema.description ? `<span class="desc">${escapeHtml(schema.description)}</span>` : '';
  const req = isRequired ? '<span class="required">*</span>' : '';
  const main = title ? escapeHtml(title) : escapeHtml(key);
  const keyHint = title ? `<span class="key">${escapeHtml(key)}</span>` : '';
  return `${main}${req}${keyHint}${desc}`;
}
function renderField(value, schema, path, key, isRequired) {
  const t = schema.type;
  const alertClass = ALERTS.some(a => a.path === path && a.kind === 'ERROR') ? 'has-error'
                    : ALERTS.some(a => a.path === path && a.kind === 'REVIEW') ? 'has-review' : '';
  if (t === 'object') {
    const title = schema.title;
    const main = title ? escapeHtml(title) : escapeHtml(key);
    const keyHint = title ? `<span class="key">${escapeHtml(key)}</span>` : '';
    const desc = schema.description ? `<span class="schema-desc">${escapeHtml(schema.description)}</span>` : '';
    return `<fieldset data-path="${path}">
      <legend>${main}${keyHint}${desc}</legend>
      ${renderObject(value || {}, schema, path)}
    </fieldset>`;
  }
  if (t === 'array') {
    const items = value || [];
    const itemSchema = schema.items;
    return `<div class="field ${alertClass}" data-path="${path}">
      <label>${fieldLabelHtml(schema, key, isRequired)}</label>
      ${itemSchema.type === 'string' ? renderStringTagList(items, path) : renderObjectArray(items, itemSchema, path)}
    </div>`;
  }
  if (schema.enum) {
    return `<div class="field ${alertClass}" data-path="${path}">
      <label>${fieldLabelHtml(schema, key, isRequired)}</label>
      <select data-bind="${path}">
        ${schema.enum.map(o => `<option value="${o}" ${o===value?'selected':''}>${o}</option>`).join('')}
      </select>
    </div>`;
  }
  if (t === 'string') {
    const minLen = schema.minLength || 0;
    const usesTextarea = minLen >= 10 || (value && value.length > 60);
    const patternHint = schema.pattern ? `<div class="pattern-hint">pattern: ${escapeHtml(schema.pattern)}</div>` : '';
    const ctrl = usesTextarea
      ? `<textarea data-bind="${path}" rows="3">${escapeHtml(value || '')}</textarea>`
      : `<input type="text" data-bind="${path}" value="${escapeHtml(value || '')}">`;
    return `<div class="field ${alertClass}" data-path="${path}">
      <label>${fieldLabelHtml(schema, key, isRequired)}</label>
      ${ctrl}${patternHint}
    </div>`;
  }
  return `<div class="field" data-path="${path}"><label>${escapeHtml(labelFor(schema, key))} (unsupported type: ${t})</label></div>`;
}

function renderStringTagList(items, path) {
  return `<div class="tag-list" data-array-path="${path}">
    ${items.map((it,i) => `<span class="tag">${escapeHtml(it)}<span class="x" onclick="removeArrayItem('${path}',${i})">×</span></span>`).join('')}
    <input type="text" placeholder="+ 添加 (回车)" onkeydown="if(event.key==='Enter'){addArrayItem('${path}',this.value);this.value=''}">
  </div>`;
}

function renderObjectArray(items, itemSchema, path) {
  return `<div data-array-path="${path}">
    ${items.map((it,i) => `<div class="array-item">
      <button class="remove" onclick="removeArrayItem('${path}',${i})">移除</button>
      ${renderObject(it, itemSchema, `${path}[${i}]`)}
    </div>`).join('')}
    <button class="array-add" onclick="addArrayObjectItem('${path}')">+ 添加项</button>
  </div>`;
}

function bindInputs(root) {
  root.querySelectorAll('[data-bind]').forEach(el => {
    el.addEventListener('input', () => {
      setPath(SPEC, el.dataset.bind, el.value);
    });
  });
}

function setPath(obj, path, value) {
  const parts = parsePath(path);
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length-1]] = value;
}

function getPath(obj, path) {
  const parts = parsePath(path);
  let cur = obj;
  for (const p of parts) { if (cur == null) return undefined; cur = cur[p]; }
  return cur;
}

function parsePath(path) {
  return path.replace(/\[(\d+)\]/g, '.$1').split('.').filter(x => x !== '');
}

function addArrayItem(path, value) {
  if (!value) return;
  let arr = getPath(SPEC, path);
  if (!Array.isArray(arr)) { setPath(SPEC, path, []); arr = getPath(SPEC, path); }
  arr.push(value);
  renderForm();
}

function addArrayObjectItem(path) {
  let arr = getPath(SPEC, path);
  if (!Array.isArray(arr)) { setPath(SPEC, path, []); arr = getPath(SPEC, path); }
  arr.push({});
  renderForm();
}

function removeArrayItem(path, idx) {
  const arr = getPath(SPEC, path);
  arr.splice(idx, 1);
  renderForm();
}

async function saveSpec() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    const r = await fetch(PATHS.spec, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(SPEC, null, 2)});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    toast('已保存 ✓');
  } catch (e) {
    toast('保存失败: ' + e.message);
  }
  btn.disabled = false; btn.textContent = '保存';
}

async function reloadAll() {
  toast('重跑检测中...');
  await fetch('/api/check?spec=' + encodeURIComponent(URL_SPEC), {method:'POST'});
  await loadAll();
  toast('检测完成 ✓');
}

async function renderHtml() {
  toast('重渲染中...');
  const r = await fetch('/api/render?spec=' + encodeURIComponent(URL_SPEC), {method:'POST'});
  if (r.ok) {
    const j = await r.json();
    toast(`已渲染到 ${j.output} ✓ (另开标签查看)`);
  } else {
    toast('渲染失败');
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ========================================================================
   Bubble Diagram 专用视图 (M3.3)
   与 tools/render.py 的 spec_to_mermaid 同步维护：
     - NODE_SHAPE / EDGE_ARROW 与 render.py:68-86 保持一致
     - NODE_TYPES / EDGE_TYPES 与 schema/bubble_diagram.schema.json 枚举一致
   新增 type 时两处都要改。
   ======================================================================== */

const NODE_TYPES = ['entry', 'scene', 'combat', 'puzzle', 'dialogue', 'choice', 'cutscene', 'exit'];
const EDGE_TYPES = ['sequential', 'branch', 'optional', 'loop', 'failure'];
const NODE_SHAPE = {
  entry: ['([', '])'], exit: ['([', '])'],
  combat: ['[', ']'], scene: ['[', ']'],
  puzzle: ['{', '}'], choice: ['{', '}'],
  dialogue: ['[/', '/]'], cutscene: ['[\\', '\\]'],
};
const EDGE_ARROW = {
  sequential: '-->', branch: '-->', optional: '-.->',
  loop: '==>', failure: '-.->',
};

function isBubbleSpec(spec) {
  return ((spec && spec.meta && spec.meta.spec_id) || '').startsWith('bubble_diagram_');
}


function specToMermaid(spec) {
  const nodes = spec.nodes || [];
  const edges = spec.edges || [];
  const lines = ['graph TD'];
  // M3.6: subgraph 分组逻辑与 tools/render.py:spec_to_mermaid 同步
  const hasAnyPhase = nodes.some(n => n && typeof n === 'object' && n.phase);
  const nodeDecl = (n) => {
    const [l, r] = NODE_SHAPE[n.type] || ['[', ']'];
    const label = String(n.label || n.id || '').replace(/"/g, '\\"');
    return `${n.id || ''}${l}"${label}"${r}`;
  };
  if (hasAnyPhase) {
    const order = [], groups = {};
    for (const n of nodes) {
      if (!n || typeof n !== 'object') continue;
      const ph = n.phase || '';
      if (!(ph in groups)) { groups[ph] = []; order.push(ph); }
      groups[ph].push(n);
    }
    for (const ph of order) {
      if (ph === '') {
        for (const n of groups[ph]) lines.push(`  ${nodeDecl(n)}`);
      } else {
        const slug = ph.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'x';
        lines.push(`  subgraph phase_${slug}["${ph.replace(/"/g, '\\"')}"]`);
        for (const n of groups[ph]) lines.push(`    ${nodeDecl(n)}`);
        lines.push('  end');
      }
    }
  } else {
    for (const n of nodes) {
      if (!n || typeof n !== 'object') continue;
      lines.push(`  ${nodeDecl(n)}`);
    }
  }
  for (const e of edges) {
    if (!e || typeof e !== 'object') continue;
    const et = e.type || 'sequential';
    const arrow = EDGE_ARROW[et] || '-->';
    const lbl = String(e.label || '').replace(/"/g, '\\"');
    // M3.5: requires 前缀（合取前置依赖），与 tools/render.py:spec_to_mermaid 同步
    const reqs = Array.isArray(e.requires) ? e.requires : [];
    const prefix = reqs.length ? `[需 ${reqs.join('+')}] ` : '';
    let edgePart;
    if (et === 'failure' && lbl) edgePart = `${arrow}|"${prefix}${lbl} (失败)"|`;
    else if (et === 'failure') edgePart = `${arrow}|"${prefix}失败"|`;
    else if (prefix || lbl) edgePart = `${arrow}|"${prefix}${lbl}"|`;
    else edgePart = arrow;
    lines.push(`  ${e.from || ''} ${edgePart} ${e.to || ''}`);
  }
  return lines.join('\n');
}

let mermaidTimer = null;
let mermaidSeq = 0;
function refreshMermaid(immediate) {
  if (!isBubbleSpec(SPEC)) return;
  clearTimeout(mermaidTimer);
  const fn = async () => {
    const seq = ++mermaidSeq;
    const canvas = document.getElementById('mermaid-canvas');
    if (!canvas) return;
    const text = specToMermaid(SPEC);
    canvas.removeAttribute('data-processed');
    canvas.innerHTML = text;
    try {
      await mermaid.run({nodes: [canvas], suppressErrors: true});
    } catch (e) {
      console.warn('mermaid render error', e);
    }
    if (seq !== mermaidSeq) return;
    bindMermaidNodeClicks(canvas);
    const stats = document.getElementById('mermaid-stats');
    if (stats) stats.textContent = `${(SPEC.nodes||[]).length} 节点 · ${(SPEC.edges||[]).length} 边`;
  };
  if (immediate) fn(); else mermaidTimer = setTimeout(fn, 200);
}

function bindMermaidNodeClicks(canvas) {
  canvas.querySelectorAll('g.node').forEach(g => {
    const m = (g.id || '').match(/^flowchart-(.+?)-\d+$/);
    if (!m) return;
    const nodeId = m[1];
    g.style.cursor = 'pointer';
    g.onclick = () => jumpToNodeCard(nodeId);
  });
}

function jumpToNodeCard(nodeId) {
  const card = document.querySelector(`.node-card[data-node-id="${CSS.escape(nodeId)}"]`);
  if (!card) return;
  card.scrollIntoView({behavior: 'smooth', block: 'center'});
  card.classList.remove('flash');
  void card.offsetWidth;
  card.classList.add('flash');
  setTimeout(() => card.classList.remove('flash'), 1500);
}

function highlightMermaidNode(nodeId, on) {
  const canvas = document.getElementById('mermaid-canvas');
  if (!canvas) return;
  canvas.querySelectorAll('g.node').forEach(g => {
    const m = (g.id || '').match(/^flowchart-(.+?)-\d+$/);
    if (!m || m[1] !== nodeId) return;
    g.classList.toggle('hl', !!on);
  });
}

function renderBubbleDiagramView(spec, schema) {
  const meta = spec.meta || {};
  const ctx = spec.context || {};
  const nodes = spec.nodes || [];
  const edges = spec.edges || [];
  const metaSchema = (schema.properties && schema.properties.meta) || {properties:{}};
  const ctxSchema = (schema.properties && schema.properties.context) || {properties:{}};
  return `
    <fieldset data-path="meta">
      <legend>meta<span class="schema-desc">${escapeHtml(metaSchema.description || '')}</span></legend>
      ${renderObject(meta, metaSchema, 'meta')}
    </fieldset>
    <fieldset data-path="context">
      <legend>context<span class="schema-desc">${escapeHtml(ctxSchema.description || '')}</span></legend>
      ${renderObject(ctx, ctxSchema, 'context')}
    </fieldset>
    <h3 class="section-title">节点 <span class="muted">${nodes.length} 个 / 边 ${edges.length} 条</span></h3>
    <datalist id="phase-suggestions">
      ${[...new Set(nodes.map(n => n && n.phase).filter(Boolean))].map(p => `<option value="${escapeHtml(p)}">`).join('')}
    </datalist>
    <div id="nodes-list">
      ${nodes.map((n, i) => renderNodeCard(n, i, edges)).join('')}
    </div>
    <button class="add-node-btn" onclick="addOrphanNode()">+ 添加孤立节点（无自动连边）</button>
  `;
}

function renderNodeCard(node, idx, edges) {
  const id = node.id || '';
  const type = node.type || 'scene';
  const path = `nodes[${idx}]`;
  const outEdges = edges.map((e, ei) => ({e, ei})).filter(({e}) => e.from === id);
  const inEdges = edges.map((e, ei) => ({e, ei})).filter(({e}) => e.to === id);
  const hasErr = (p) => ALERTS.some(a => (a.path === p || a.path.startsWith(p + '.')) && a.kind === 'ERROR');
  const cardErr = hasErr(path);
  return `
    <div class="node-card${cardErr ? ' has-error' : ''}" data-node-id="${escapeHtml(id)}" data-type="${escapeHtml(type)}" data-path="${path}" data-node-idx="${idx}">
      <div class="card-header">
        <span class="type-pill">${escapeHtml(type)}</span>
        <span class="card-id">${escapeHtml(id) || '<i style="color:#aaa">(no id)</i>'}</span>
        <span class="card-actions">
          <button onclick="openInsertAfter('${escapeAttr(id)}')" title="在此节点后插入新节点（自动连一条 sequential 边）">+ 在此后插入</button>
          <button onclick="openForkFrom('${escapeAttr(id)}')" title="从此节点分叉（连到新节点或已有节点）">+ 分叉</button>
          <button class="danger" onclick="deleteNodeById('${escapeAttr(id)}')" title="删除此节点及其所有相关边">🗑</button>
        </span>
      </div>
      <div class="card-fields">
        <label>id</label>
        <input type="text" data-bind="${path}.id" value="${escapeHtml(id)}" placeholder="snake_case">
        <label>type</label>
        <select data-bind-type="${path}.type" onchange="onNodeTypeChange(this, ${idx})">
          ${NODE_TYPES.map(t => `<option value="${t}" ${t===type?'selected':''}>${t}</option>`).join('')}
        </select>
        <label>phase</label>
        <input type="text" data-bind="${path}.phase" value="${escapeHtml(node.phase || '')}" placeholder="可选 (如 Phase I / Act 1)" list="phase-suggestions">
        <label>label</label>
        <input type="text" data-bind="${path}.label" value="${escapeHtml(node.label || '')}" placeholder="中文短描述">
        <label>notes</label>
        <textarea data-bind="${path}.notes" rows="2" placeholder="设计意图 / 关键参数 / 联动备注（可选）">${escapeHtml(node.notes || '')}</textarea>
      </div>
      <div class="edges-section">
        <div class="edges-row">
          <span class="edges-label">出边 (${outEdges.length})</span>
          <span class="edges-chips">
            ${outEdges.map(({e, ei}) => `<span class="edge-chip" onclick="openEditEdge(${ei})" title="点击编辑">→ ${escapeHtml(e.to || '?')} <span class="chip-type">[${escapeHtml(e.type || 'sequential')}]</span>${(e.requires && e.requires.length) ? ' <span class="chip-req">需' + e.requires.map(escapeHtml).join('+') + '</span>' : ''}${e.label ? ' ' + escapeHtml(e.label) : ''}</span>`).join('') || '<span class="empty-chip">(无出边)</span>'}
            <button class="add-edge-btn" onclick="openForkFrom('${escapeAttr(id)}')" title="从此节点添加出边">+</button>
          </span>
        </div>
        <div class="edges-row">
          <span class="edges-label">入边 (${inEdges.length})</span>
          <span class="edges-chips">
            ${inEdges.map(({e, ei}) => `<span class="edge-chip readonly" onclick="jumpToNodeCard('${escapeAttr(e.from)}')" title="跳到 ${escapeHtml(e.from)}">${escapeHtml(e.from || '?')} → <span class="chip-type">[${escapeHtml(e.type || 'sequential')}]</span></span>`).join('') || '<span class="empty-chip">(无入边)</span>'}
          </span>
        </div>
      </div>
    </div>
  `;
}

function bindBubbleDiagramHandlers(root) {
  // meta / context fieldset 仍走通用 bindInputs
  bindInputs(root);
  // 节点卡片交互
  root.querySelectorAll('.node-card').forEach(card => {
    const nodeId = card.dataset.nodeId;
    if (!nodeId) return;
    card.addEventListener('mouseenter', () => highlightMermaidNode(nodeId, true));
    card.addEventListener('mouseleave', () => highlightMermaidNode(nodeId, false));
    card.querySelectorAll('input,textarea,select').forEach(inp => {
      inp.addEventListener('focus', () => highlightMermaidNode(nodeId, true));
      inp.addEventListener('blur', () => highlightMermaidNode(nodeId, false));
    });
  });
  // 任何字段变化触发 mermaid 重渲（debounced 200ms）
  root.querySelectorAll('[data-bind]').forEach(el => {
    el.addEventListener('input', () => refreshMermaid());
  });
  // id 字段失焦时全量 renderForm（id 变会让 edges chips / data-node-id 失效）
  root.querySelectorAll('input[data-bind$=".id"]').forEach(el => {
    el.addEventListener('change', () => renderForm());
  });
}

function onNodeTypeChange(sel, idx) {
  const path = sel.getAttribute('data-bind-type');
  setPath(SPEC, path, sel.value);
  renderForm();
  refreshMermaid(true);
}

/* ---------- Popover 框架 ---------- */
function showPopover(html) {
  const host = document.getElementById('popover-host');
  host.innerHTML = `<div class="popover-overlay" onclick="closePopover()"></div><div class="popover">${html}</div>`;
  host.classList.add('show');
  setTimeout(() => {
    const first = host.querySelector('input,select,textarea');
    if (first) first.focus();
  }, 50);
}
function closePopover() {
  const host = document.getElementById('popover-host');
  host.innerHTML = '';
  host.classList.remove('show');
}

function validateNewNode(id, label) {
  if (!id || !label) { toast('id 和 label 必填'); return false; }
  if (!/^[a-z][a-z0-9_]*$/.test(id)) { toast('id 必须 snake_case (小写字母开头)'); return false; }
  if ((SPEC.nodes || []).some(n => n.id === id)) { toast(`id "${id}" 已存在`); return false; }
  return true;
}

/* ---------- + 在此后插入 ---------- */
function openInsertAfter(srcId) {
  showPopover(`
    <h3>在 <code>${escapeHtml(srcId)}</code> 之后插入新节点</h3>
    <div class="hint">将新建一个节点 + 自动连一条 <b>sequential</b> 边 ${escapeHtml(srcId)} → 新节点</div>
    <label>新节点 id</label>
    <input id="pop-id" type="text" placeholder="snake_case">
    <label>type</label>
    <select id="pop-type">${NODE_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}</select>
    <label>label</label>
    <input id="pop-label" type="text" placeholder="中文短描述">
    <div class="popover-actions">
      <button onclick="closePopover()">取消</button>
      <button class="primary" onclick="commitInsertAfter('${escapeAttr(srcId)}')">插入</button>
    </div>
  `);
}
function commitInsertAfter(srcId) {
  const id = document.getElementById('pop-id').value.trim();
  const type = document.getElementById('pop-type').value;
  const label = document.getElementById('pop-label').value.trim();
  if (!validateNewNode(id, label)) return;
  SPEC.nodes = SPEC.nodes || [];
  SPEC.edges = SPEC.edges || [];
  SPEC.nodes.push({id, type, label});
  SPEC.edges.push({from: srcId, to: id, type: 'sequential'});
  closePopover();
  renderForm();
  toast(`已插入 ${id} 并连边`);
}

/* ---------- + 分叉 ---------- */
function openForkFrom(srcId) {
  const allNodeIds = (SPEC.nodes || []).map(n => n.id).filter(x => x);
  showPopover(`
    <h3>从 <code>${escapeHtml(srcId)}</code> 分叉</h3>
    <div class="hint">连一条新边到 <b>新节点</b> 或 <b>已有节点</b></div>
    <label>目标</label>
    <select id="pop-target" onchange="toggleForkNewFields()">
      <option value="__new__">+ 新节点</option>
      ${allNodeIds.map(nid => `<option value="${escapeHtml(nid)}">${escapeHtml(nid)}</option>`).join('')}
    </select>
    <div id="fork-new-fields">
      <label>新节点 id</label>
      <input id="pop-id" type="text" placeholder="snake_case">
      <label>type</label>
      <select id="pop-type">${NODE_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}</select>
      <label>label</label>
      <input id="pop-label" type="text" placeholder="中文短描述">
    </div>
    <label>边 type</label>
    <select id="pop-edge-type">${EDGE_TYPES.map(t => `<option value="${t}" ${t==='branch'?'selected':''}>${t}</option>`).join('')}</select>
    <label>边 label (可选)</label>
    <input id="pop-edge-label" type="text" placeholder="如「拒绝交易」">
    <div class="popover-actions">
      <button onclick="closePopover()">取消</button>
      <button class="primary" onclick="commitForkFrom('${escapeAttr(srcId)}')">分叉</button>
    </div>
  `);
}
function toggleForkNewFields() {
  const target = document.getElementById('pop-target').value;
  document.getElementById('fork-new-fields').style.display = target === '__new__' ? 'block' : 'none';
}
function commitForkFrom(srcId) {
  const target = document.getElementById('pop-target').value;
  const edgeType = document.getElementById('pop-edge-type').value;
  const edgeLabel = document.getElementById('pop-edge-label').value.trim();
  let toId;
  if (target === '__new__') {
    const id = document.getElementById('pop-id').value.trim();
    const type = document.getElementById('pop-type').value;
    const label = document.getElementById('pop-label').value.trim();
    if (!validateNewNode(id, label)) return;
    SPEC.nodes = SPEC.nodes || [];
    SPEC.nodes.push({id, type, label});
    toId = id;
  } else {
    toId = target;
    if ((SPEC.edges || []).some(e => e.from === srcId && e.to === toId)) {
      if (!confirm(`${srcId} → ${toId} 已存在边，仍然添加？`)) return;
    }
  }
  SPEC.edges = SPEC.edges || [];
  const edge = {from: srcId, to: toId, type: edgeType};
  if (edgeLabel) edge.label = edgeLabel;
  SPEC.edges.push(edge);
  closePopover();
  renderForm();
  toast(`已分叉到 ${toId}`);
}

/* ---------- 删除节点 ---------- */
function deleteNodeById(nodeId) {
  if (!nodeId) { toast('节点无 id，无法删除'); return; }
  const relCount = (SPEC.edges || []).filter(e => e.from === nodeId || e.to === nodeId).length;
  if (!confirm(`将删除节点 "${nodeId}" 及其 ${relCount} 条相关边，确认？`)) return;
  SPEC.nodes = (SPEC.nodes || []).filter(n => n.id !== nodeId);
  SPEC.edges = (SPEC.edges || []).filter(e => e.from !== nodeId && e.to !== nodeId);
  renderForm();
  toast(`已删除 ${nodeId}`);
}

/* ---------- + 添加孤立节点 ---------- */
function addOrphanNode() {
  showPopover(`
    <h3>添加孤立节点</h3>
    <div class="hint">⚠️ 不会自动连边，保存后会触发 REVIEW (isolated)。适合作为新流程起点</div>
    <label>id</label>
    <input id="pop-id" type="text" placeholder="snake_case">
    <label>type</label>
    <select id="pop-type">${NODE_TYPES.map(t => `<option value="${t}">${t}</option>`).join('')}</select>
    <label>label</label>
    <input id="pop-label" type="text" placeholder="中文短描述">
    <div class="popover-actions">
      <button onclick="closePopover()">取消</button>
      <button class="primary" onclick="commitAddOrphan()">添加</button>
    </div>
  `);
}
function commitAddOrphan() {
  const id = document.getElementById('pop-id').value.trim();
  const type = document.getElementById('pop-type').value;
  const label = document.getElementById('pop-label').value.trim();
  if (!validateNewNode(id, label)) return;
  SPEC.nodes = SPEC.nodes || [];
  SPEC.nodes.push({id, type, label});
  closePopover();
  renderForm();
  toast(`已添加 ${id}`);
}

/* ---------- 编辑边 popover ---------- */
function openEditEdge(edgeIdx) {
  const e = (SPEC.edges || [])[edgeIdx];
  if (!e) return;
  const nodeIds = (SPEC.nodes || []).map(n => n.id).filter(x => x);
  const reqsCur = Array.isArray(e.requires) ? e.requires : [];
  showPopover(`
    <h3>编辑边 #${edgeIdx}</h3>
    <label>from</label>
    <select id="pop-from">${nodeIds.map(nid => `<option value="${escapeHtml(nid)}" ${nid===e.from?'selected':''}>${escapeHtml(nid)}</option>`).join('')}</select>
    <label>to</label>
    <select id="pop-to">${nodeIds.map(nid => `<option value="${escapeHtml(nid)}" ${nid===e.to?'selected':''}>${escapeHtml(nid)}</option>`).join('')}</select>
    <label>type</label>
    <select id="pop-edge-type">${EDGE_TYPES.map(t => `<option value="${t}" ${t===(e.type||'sequential')?'selected':''}>${t}</option>`).join('')}</select>
    <label>label (可选)</label>
    <input id="pop-edge-label" type="text" value="${escapeHtml(e.label || '')}">
    <label>requires (合取前置, 多选)</label>
    <select id="pop-requires" multiple size="6" style="height:auto">
      ${nodeIds.filter(nid => nid !== e.from && nid !== e.to).map(nid =>
        `<option value="${escapeHtml(nid)}" ${reqsCur.includes(nid)?'selected':''}>${escapeHtml(nid)}</option>`
      ).join('')}
    </select>
    <div class="hint">按 Cmd/Ctrl 多选；选中的节点必须全部已访问，本边才触发（如知识锁需 Key02+Key03）</div>
    <div class="popover-actions">
      <button onclick="closePopover()">取消</button>
      <button class="danger" onclick="commitDeleteEdge(${edgeIdx})">删除边</button>
      <button class="primary" onclick="commitUpdateEdge(${edgeIdx})">保存</button>
    </div>
  `);
}
function commitUpdateEdge(edgeIdx) {
  const from = document.getElementById('pop-from').value;
  const to = document.getElementById('pop-to').value;
  const type = document.getElementById('pop-edge-type').value;
  const label = document.getElementById('pop-edge-label').value.trim();
  const reqsEl = document.getElementById('pop-requires');
  const reqs = Array.from(reqsEl.selectedOptions).map(o => o.value);
  const e = SPEC.edges[edgeIdx];
  e.from = from; e.to = to; e.type = type;
  if (label) e.label = label; else delete e.label;
  if (reqs.length) e.requires = reqs; else delete e.requires;
  closePopover();
  renderForm();
  toast('边已更新');
}
function commitDeleteEdge(edgeIdx) {
  if (!confirm('确认删除此边？')) return;
  SPEC.edges.splice(edgeIdx, 1);
  closePopover();
  renderForm();
  toast('边已删除');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closePopover();
});

loadAll().catch(e => alert('加载失败: ' + e.message + '\n请确认已跑 python3 tools/serve_editor.py'));
</script>

</body>
</html>
