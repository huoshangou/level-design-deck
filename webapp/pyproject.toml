[project]
name = "level-design-deck-webapp"
version = "0.1.0"
description = "Web UI + Daemon for level-design-deck (M4 / B 阶段)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.130",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "python-multipart",
    "watchfiles",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
